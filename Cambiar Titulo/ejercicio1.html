<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ejercicio1.css">
    <title>Document</title>
</head>
<body>
    <div class="contenedor">
        <div class="titulo">
            <h1>EMPEZANDO CON JAVASCRIPT</h1>
        </div>
        <div id="recuadro">
            <h2 id="texto">TEXTO DEL DIV</h2>
        </div>
        <hr id="uno">
        <div class="insertar">
            <h3>Introduce un texto aqui</h3>
            <input type="text" id="insertar">
        </div>
        <hr id="dos">
        <div class="colores">
            <h3>Selecciona color de fondo</h3>
            <input type="color" id="colorFondo">
            <h3>Selecciona color del borde</h3>
            <input type="color" id="colorBorde">
            <h3>Selecciona color del texto</h3>
            <input type="color" id="colorTexto">
        </div>
        <hr id="tres">
        <div class="botones">
            <button id="cambiartxt">Cambiar Texto</button>
            <button id="fondo">Cambiar color fondo</button>
            <button id="borde">Cambiar color borde</button>
            <button id="colortxt">Cambiar color texto</button>
        </div>
    </div>
    <script src="ejercicio1.js"></script>
</body>
</html>
