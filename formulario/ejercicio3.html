<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ejercicio3.css">
    <title>Document</title>
</head>
<body>
    <div class="contenedor">
        <h3>VALOR EN CONTROLES</h3>
        <div class="cajas"> 
            <label for="texto">Caja texto:</label>
            <input type="text" id="texto">
        </div>
        <div class="cajas"> 
            <label for="numero">Caja número:</label>
            <input type="number" id="numero">
        </div>
        <div class="cajas"> 
            <label for="contraseña">Caja password:</label>
            <input type="password" id="contraseña">
        </div>
        <div class="cajas"> 
            <label for="fecha">Caja fecha:</label>
            <input type="date" id="fecha">
        </div>
        <div class="cajas"> 
            <label for="hora">Caja hora:</label>
            <input type="time" id="hora">
        </div>
        <div class="cajas"> 
            <label for="radio">Caja radio:</label>
            <input type="radio" id="radio">
        </div>
        <div class="cajas"> 
            <label for="check">Caja check:</label>
            <input type="checkbox" id="check">
        </div>
        <div class="cajas">
            <label for="opciones">Caja check:</label>
            <select id="opciones">
                <option value="cero" disabled selected hidden>Selecciona una opcción</option>
                <option value="1">Opción 1</option>
                <option value="2">Opción 2</option>
                <option value="3">Opción 3</option>
            </select>
        </div>
        <div class="cajas">
            <button id="btn">Capturar valores</button>
        </div>
    </div>
    
    <script src="ejercicio3.js"></script>
</body>
</html>
