<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="stylesheet" href="calculadorav2.css">
</head>
<body>

    
    <div class="contenedor">
        <div id="titulo">
            <h1>Calculadora</h1>
         </div>

        <div class="calculadora">
            <img src="calculadora.jpg" alt="calculadora">

            <div id="pantalla">0</div>

            <div class="botones">
                <button class="b7">7</button>
                <button class="b8">8</button>
                <button class="b9">9</button>
                <button class="bdiv">/</button>

                <button class="b4">4</button>
                <button class="b5">5</button>
                <button class="b6">6</button>
                <button class="bmul">*</button>

                <button class="b1">1</button>
                <button class="b2">2</button>
                <button class="b3">3</button>
                <button class="bmenos">-</button>

                <button class="b0">0</button>
                <button class="bpunto">.</button>
                <button class="bigual">=</button>
                <button class="bmas">+</button>

                <button class="bclear">C</button>
            </div>
        </div>
    </div>

    <script src="calculadorav2.js"></script>

</body>
</html>
